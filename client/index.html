<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spielersuche · Clash Royale API</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <main class="container">

    <section class="card search-card">
      <h1 class="page-title">Spieler suchen</h1>
      <p class="page-subtitle">Spieler-Tag eingeben, z. B. aus dem Profil im Spiel</p>

      <form id="playerForm" class="search-form">
        <input id="tagInput" class="input" placeholder="#PLAYER_TAG" autocomplete="off" spellcheck="false">
        <button class="btn btn-primary" type="submit">Spieler laden</button>
      </form>
    </section>

    <div id="playerStatus"></div>

    <div id="playerResult" class="stack" hidden>

      <section class="card hero" id="playerHero"></section>

      <div class="grid grid-3">
        <section class="card">
          <h2 class="card-title">📈 Fortschritt</h2>
          <div id="progressInfo"></div>
        </section>

        <section class="card">
          <h2 class="card-title">⚔️ Battle-Statistik</h2>
          <div id="battleStats"></div>
        </section>

        <section class="card">
          <h2 class="card-title">✨ Sonstiges</h2>
          <div id="extraInfo"></div>
        </section>
      </div>

      <section class="card">
        <div class="card-header">
          <h2 class="card-title">🃏 Aktuelles Deck</h2>
          <span class="muted" id="deckElixir"></span>
        </div>
        <div id="currentDeck"></div>
      </section>

      <section class="card">
        <h2 class="card-title">🕑 Letzte Battles</h2>
        <div id="battleLog" class="stack"></div>
        <button class="btn btn-ghost btn-block" id="moreBattlesBtn" type="button" hidden>Mehr anzeigen</button>
      </section>

      <details class="card raw-data">
        <summary>Rohdaten (JSON)</summary>
        <pre id="rawData"></pre>
      </details>

    </div>

  </main>

</body>
</html>
