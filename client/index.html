<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Clash Royale API</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="js/menu.js" defer></script>
<script src="js/app.js" defer></script>
</head>

<body class="dark">

<!-- Navbar -->

<header class="topbar">

<button id="menuBtn">☰</button>

<h4 class="title">Clash Royale API</h4>

<label class="theme-switch">
<input type="checkbox" id="themeToggle">
<span>🌙</span>
</label>

</header>

<!-- Sidebar -->

<aside id="sidebar">

<a href="/">Spielersuche</a>
<a href="/leaderboards.html">Leaderboards</a>
<a href="/clans.html">Clansuche</a>
<a href="/decks.html">Decks</a>

</aside>

<!-- Main -->

<main class="container mt-5">

<div class="card p-4 search-box">

<h2 class="mb-3 text-center title-main">Spieler suchen</h2>

<input id="tagInput" class="form-control mb-3" placeholder="#PLAYER_TAG">

<button class="btn btn-primary w-100" onclick="loadPlayer()">
Spieler laden
</button>

</div>

<div class="row g-4 mt-4" id="playerBoxes">

    <div class="col-md-6">
        <div class="card info-box">
        <h5>Spieler</h5>
        <div id="playerInfo"></div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card info-box">
        <h5>Progress</h5>
        <div id="progressInfo"></div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card info-box">
        <h5>Battle Stats</h5>
        <div id="battleStats"></div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card info-box">
        <h5>Sonstiges</h5>
        <div id="extraInfo"></div>
        </div>
    </div>

    <div class="container mt-5">
      <h5>Raw Data</h5>
      <pre id="rawData"></pre>
    </div>

    

    <div class="col-12">
    <div class="card info-box">
      <h5>Letzte Battles</h5>
      <div id="battleLog"></div>
    </div>
  </div>

</main>

</body>
</html>
