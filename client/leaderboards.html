<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboards · Clash Royale API</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/leaderboard.js"></script>
</head>
<body>

  <main class="container">

    <div class="page-head">
      <div>
        <h1 class="page-title">🏆 Leaderboards</h1>
        <p class="page-subtitle" id="leaderboardSubtitle">Top 100 · Path of Legends</p>
      </div>

      <div class="dropdown" id="regionDropdown">
        <button class="select-btn" id="regionButton" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="select-btn-label">
            <span id="regionIcon">🌍</span>
            <span id="regionName">Global</span>
          </span>
          <span class="chevron">▾</span>
        </button>

        <div class="dropdown-panel" id="regionPanel" hidden>
          <input class="input input-sm" id="regionSearch" placeholder="Land suchen …" autocomplete="off">
          <ul class="dropdown-list" id="regionList" role="listbox"></ul>
        </div>
      </div>
    </div>

    <section class="card card-flush">
      <div class="lb-row lb-header">
        <span>#</span>
        <span>Spieler</span>
        <span class="lb-level">Level</span>
        <span class="lb-medals">Medaillen</span>
        <span></span>
      </div>
      <div id="leaderboardTable"></div>
    </section>

  </main>

</body>
</html>
