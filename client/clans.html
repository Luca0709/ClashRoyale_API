<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Clansuche</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="js/menu.js" defer></script>
  <script src="js/clans.js" defer></script>
</head>
<body class="dark">

  <!-- Topbar -->
  <header class="topbar">
    <button id="menuBtn">☰</button>
    <h4 class="title">Clash Royale API</h4>
    <label class="theme-switch">
      <input type="checkbox" id="themeToggle">
      <span>🌙</span>
    </label>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar">
    <a href="/">Spielersuche</a>
    <a href="/leaderboards.html">Leaderboards</a>
    <a href="/clans.html">Clansuche</a>
    <a href="/decks.html">Decks</a>
  </aside>

  <!-- Main -->
  <main class="container mt-5">
    <div class="card p-4 search-box">
      <h2 class="mb-3 text-center title-main">Clans suchen</h2>

      <input
        id="clanInput"
        class="form-control mb-3"
        placeholder="Clan Name eingeben"
      >

      <button class="btn btn-primary w-100" onclick="loadClans()">
        Clan suchen
      </button>
    </div>

    <div class="card info-box mt-4">
      <h5>Suchergebnisse</h5>
      <div id="clanResults"></div>
    </div>
  </main>

</body>
</html>
