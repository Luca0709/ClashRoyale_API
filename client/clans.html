<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clansuche · Clash Royale API</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/clans.js"></script>
</head>
<body>

  <main class="container">

    <section class="card search-card">
      <h1 class="page-title">Clans suchen</h1>
      <p class="page-subtitle">Nach Clanname suchen (mind. 3 Zeichen) oder direkt einen #CLANTAG eingeben</p>

      <form id="clanForm" class="search-form search-form-wide">
        <input id="clanInput" class="input" placeholder="Clanname oder #TAG" autocomplete="off" spellcheck="false">
        <select id="regionSelect" class="input select" aria-label="Region">
          <option value="">🌍 Alle Regionen</option>
        </select>
        <button class="btn btn-primary" type="submit">Clan suchen</button>
      </form>
    </section>

    <div id="clanStatus"></div>
    <div id="clanResults" class="grid grid-auto"></div>

  </main>

  <dialog id="clanDialog" class="modal" aria-label="Clan-Details">
    <div class="modal-inner">
      <button class="icon-btn modal-close" id="closeClanDialog" type="button" aria-label="Schließen">✕</button>
      <div id="clanDialogBody" class="modal-body"></div>
    </div>
  </dialog>

</body>
</html>
